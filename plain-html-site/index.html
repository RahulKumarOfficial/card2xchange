<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card2Xchange | Sell Gift Cards</title>
    <!-- Tailwind CSS (No build required) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- Custom Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#2563eb',
                        dark: '#0f172a'
                    }
                }
            }
        }
    </script>

    <!-- Custom Vanilla CSS -->
    <style>
        .fade-in { animation: fadeIn 0.6s ease-out forwards; opacity: 0; }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(15px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased selection:bg-brand selection:text-white">
    
    <!-- Navigation -->
    <nav class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex-shrink-0 flex items-center gap-2 cursor-pointer">
                    <i class="fa-solid fa-wallet text-brand text-2xl"></i>
                    <span class="font-bold text-xl text-dark tracking-tight">Card2Xchange</span>
                </div>
                
                <!-- Desktop Menu -->
                <div class="hidden md:flex space-x-8 items-center">
                    <a href="#" class="text-slate-600 hover:text-brand font-medium transition">Home</a>
                    <a href="#rates" class="text-slate-600 hover:text-brand font-medium transition">Rates</a>
                    <a href="#" class="text-slate-600 hover:text-brand font-medium transition">Login</a>
                    <button onclick="openModal()" class="bg-brand text-white px-5 py-2.5 rounded-full font-medium hover:bg-blue-700 transition shadow-md hover:shadow-lg transform hover:-translate-y-0.5">
                        Start Trading
                    </button>
                </div>

                <!-- Mobile Menu Button -->
                <div class="md:hidden flex items-center">
                    <button class="text-slate-600 hover:text-dark text-2xl">
                        <i class="fa-solid fa-bars"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-20 lg:py-32 fade-in">
        <div class="text-center max-w-3xl mx-auto">
            <h1 class="text-5xl lg:text-6xl font-extrabold text-dark tracking-tight mb-6">
                Trade Your Gift Cards for 
                <span class="text-transparent bg-clip-text bg-gradient-to-r from-brand to-cyan-500">Instant Cash</span>
            </h1>
            <p class="text-lg lg:text-xl text-slate-600 mb-10 leading-relaxed">
                The most secure and fast platform to exchange Amazon, Steam, iTunes, and other gift cards directly into your bank account. Connects seamlessly with your Supabase backend.
            </p>
            <div class="flex flex-col sm:flex-row gap-4 justify-center">
                <button onclick="openModal()" class="bg-brand text-white px-8 py-4 rounded-full font-bold text-lg hover:bg-blue-700 transition shadow-lg hover:shadow-brand/30 flex items-center justify-center gap-2 transform hover:-translate-y-1">
                    <i class="fa-solid fa-bolt"></i> Sell Card Now
                </button>
                <button class="bg-white text-slate-700 border border-slate-200 px-8 py-4 rounded-full font-bold text-lg hover:bg-slate-50 transition shadow-sm flex items-center justify-center gap-2">
                    <i class="fa-solid fa-chart-line"></i> View Live Rates
                </button>
            </div>
        </div>
    </main>

    <!-- Dashboard Preview Section -->
    <section class="max-w-4xl mx-auto px-4 py-12 fade-in" style="animation-delay: 0.2s;">
        <div class="bg-white rounded-2xl shadow-xl shadow-slate-200/50 border border-slate-100 overflow-hidden">
            <div class="border-b border-slate-100 p-6 bg-slate-50/50 flex justify-between items-center">
                <h2 class="text-xl font-bold text-dark flex items-center gap-2">
                    <i class="fa-solid fa-clock-rotate-left text-slate-400"></i> Recent Transactions
                </h2>
                <span class="bg-green-100 text-green-700 px-3 py-1.5 rounded-full text-xs font-bold uppercase tracking-wider flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span> System Online
                </span>
            </div>
            <div class="p-4 sm:p-6">
                <div id="transaction-list" class="space-y-2">
                    <!-- Javascript will populate this -->
                </div>
            </div>
        </div>
    </section>

    <!-- Action Modal -->
    <div id="tradeModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center z-50 opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8 mx-4 transform scale-95 transition-transform duration-300" id="modalContent">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-2xl font-bold text-dark">Submit Gift Card</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-700 bg-slate-100 hover:bg-slate-200 w-8 h-8 rounded-full flex items-center justify-center transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5">Select Card Brand</label>
                    <select class="w-full border border-slate-200 rounded-xl p-3.5 focus:ring-2 focus:ring-brand focus:border-brand outline-none bg-slate-50 transition">
                        <option>Amazon Gift Card</option>
                        <option>Steam Wallet</option>
                        <option>Google Play Console</option>
                        <option>iTunes</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5">Card Code</label>
                    <input type="text" placeholder="XXXX-XXXX-XXXX-XXXX" class="w-full border border-slate-200 rounded-xl p-3.5 focus:ring-2 focus:ring-brand focus:border-brand outline-none bg-slate-50 transition font-mono uppercase">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5">Card Value ($)</label>
                    <input type="number" placeholder="100.00" class="w-full border border-slate-200 rounded-xl p-3.5 focus:ring-2 focus:ring-brand focus:border-brand outline-none bg-slate-50 transition">
                </div>
                <button onclick="submitTrade()" class="w-full bg-brand text-white font-bold py-4 rounded-xl hover:bg-blue-700 active:bg-blue-800 transition mt-2 shadow-md">
                    Process with Supabase
                </button>
            </div>
        </div>
    </div>

    <!-- Link Vanilla JS -->
    <script src="./script.js"></script>
</body>
</html>
